id: pptx-authoring
version: 2.2.0
catalog_line: 'Build editable PowerPoint decks from master layouts with native charts and notes.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_write, file_read, document_read, image_read, publish_artifact, files_list]
  binaries:
    [
      /usr/local/lib/athanor/python/bin/python3,
      athanor-office-convert,
      pdftoppm,
      pdftotext,
      pdfinfo
    ]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec:
    [
      /usr/local/lib/athanor/python/bin/python3,
      athanor-office-convert,
      pdftoppm,
      pdftotext,
      pdfinfo,
      fc-list
    ]
  connectors: []
  spend: none

verify:
  - run: '/usr/local/lib/athanor/python/bin/python3 -c "from pptx import Presentation; import sys; print(len(Presentation(sys.argv[1]).slides._sldIdLst))" deck.pptx'
    assert: 'exits 0 and the slide count matches the plan'
  - run: 'athanor-office-convert deck.pptx proofs/deck.pdf'
    assert: 'exits 0 and pdfinfo reports one page per slide'
  - check: 'Round-tripped text word count is within 2 percent of the placed text, so nothing was clipped.'
  - check: 'Every slide image was inspected: no overlap, no edge-touching text, charts labelled.'
