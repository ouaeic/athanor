id: xlsx-authoring
version: 2.0.0
catalog_line: 'Build spreadsheets with live formulas, formats and charts, then assert zero error cells.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools: [shell, file_write, file_read, document_read, image_read, publish_artifact, files_list]
  binaries: [/usr/local/lib/athanor/python/bin/python3, athanor-office-convert]

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**', '$TMP/**']
  net.hosts: []
  exec: [/usr/local/lib/athanor/python/bin/python3, athanor-office-convert, pdftoppm, pdftotext]
  connectors: []
  spend: none

verify:
  - run: 'athanor-office-convert model.xlsx model.recalc.xlsx'
    assert: 'exits 0'
  - run: '/usr/local/lib/athanor/python/bin/python3 scripts/count_error_cells.py model.recalc.xlsx'
    assert: 'exits 0, so error_cells == 0 and uncached_formulas == 0'
  - check: 'One headline total matches the same arithmetic done independently from the source data.'
  - check: 'No column renders as ##### and every chart axis is labelled in the page proof.'
