id: code-change
version: 2.0.0
catalog_line: 'Cut where the behaviour is decided, watch the test fail first, verify with the project’s commands.'

lineage:
  origin: builtin
  approved_by: null
  approved_at: null

requires:
  tools:
    [
      repo_overview,
      code_search,
      code_diagnostics,
      file_read,
      file_write,
      file_patch,
      set_acceptance,
      shell
    ]
  binaries: []

capability:
  fs.read: ['$WORKSPACE/**']
  fs.write: ['$WORKSPACE/**']
  net.hosts: []
  exec: []
  connectors: []
  spend: none

verify:
  - run: "the project's own test command, taken from its CI workflow"
    assert: 'exits 0 and the reported test count increased by the new tests'
  - check: 'The new test was observed failing before the change.'
  - check: 'The diff contains no reformatting or renames outside the requested change.'
