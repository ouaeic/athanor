# The application's content security policy, in one file rather than three.
#
# It was written out at the site root, in the immutable asset location and in the SPA fallback, and
# a policy that has to be edited in three places to stay one policy is a policy that will not.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
