<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    The social card. It carries the same furnace as apps/web/src/BrandMark.tsx and the same warm
    ramp as the interface, with ember written out rather than taken from a custom property: this
    file is fetched by link previewers with no document around it.
  -->
  <defs>
    <radialGradient id="background" cx="22%" cy="13%" r="100%">
      <stop stop-color="#2b2724"/>
      <stop offset=".48" stop-color="#171412"/>
      <stop offset="1" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="brick" x1="34" y1="52" x2="96" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b503e"/>
      <stop offset=".55" stop-color="#48362a"/>
      <stop offset="1" stop-color="#2c211a"/>
    </linearGradient>
    <linearGradient id="iron" x1="30" y1="28" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a39a92"/>
      <stop offset=".45" stop-color="#77706a"/>
      <stop offset="1" stop-color="#514c47"/>
    </linearGradient>
    <linearGradient id="metal" x1="44" y1="84" x2="84" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fdf5ee"/>
      <stop offset=".5" stop-color="#c2b4a6"/>
      <stop offset="1" stop-color="#867b72"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#f2a13f" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#f2a13f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f2a13f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="365" y1="218" x2="855" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf1e8"/>
      <stop offset=".43" stop-color="#d8c4b2"/>
      <stop offset=".7" stop-color="#f6ebe0"/>
      <stop offset="1" stop-color="#b09884"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="166" cy="123" r="290" fill="#fff" opacity=".018"/>
  <rect x="72" y="76" width="1056" height="478" rx="38" fill="#fff" opacity=".018" stroke="#fff" stroke-opacity=".09"/>
  <text x="390" y="305" fill="url(#word)" font-family="Inter, Arial, sans-serif" font-size="110" font-weight="590" letter-spacing="-5">athanor</text>
  <text x="397" y="376" fill="#a2988e" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="420" letter-spacing="-.4">your private cloud computer, through chat</text>
  <text x="397" y="436" fill="#7a706a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="430" letter-spacing="1.2">OPEN SOURCE · MANAGED OPEN-WEIGHT AI · ZERO CONTENT LOGGING</text>
</svg>
